{% extends "telemed/base.html" %}
{% load static %}

{% block title %}Image Enhancement - TeleMed Vision{% endblock %}

{% block content %}
<main>
    <div class="container" style="padding-top: 20px;">
        <div class="page-header">
            <h1>
                <span>Image Enhancement</span>
                <small>Adjust and improve image quality</small>
            </h1>
        </div>

        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5>Select Image</h5>
                    </div>
                    <div class="card-body">
                        <select class="form-control mb-3" id="enhanceStudy">
                            <option value="">Select study...</option>
                            {% for study in studies %}
                            <option value="{{ study.id }}">{{ study.patient.name }} - {{ study.study_type }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h5>Adjustments</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label>Brightness</label>
                            <input type="range" class="form-range" id="brightness" min="-100" max="100" value="0">
                        </div>
                        <div class="mb-3">
                            <label>Contrast</label>
                            <input type="range" class="form-range" id="contrast" min="-100" max="100" value="0">
                        </div>
                        <div class="mb-3">
                            <label>Saturation</label>
                            <input type="range" class="form-range" id="saturation" min="-100" max="100" value="0">
                        </div>
                        <div class="mb-3">
                            <label>Sharpness</label>
                            <input type="range" class="form-range" id="sharpness" min="0" max="100" value="0">
                        </div>
                        <button class="btn btn-primary w-100">Apply</button>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card" style="min-height: 500px; display: flex; align-items: center; justify-content: center;">
                    <div class="text-center text-muted">
                        <i class="bi bi-sliders" style="font-size: 64px;"></i>
                        <p class="mt-3">Select an image to enhance</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
