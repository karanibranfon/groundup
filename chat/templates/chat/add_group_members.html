{% extends 'chat/base.html' %}

{% block title %}Add Members - {{ group.name }}{% endblock %}

{% block content %}
<div style="min-height: 100vh; background: var(--bg-light); padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto;">
        <div style="background: white; border-radius: 10px; overflow: hidden;">
            <div style="background: var(--primary); padding: 15px; color: white;">
                <a href="{% url 'group_info' group.id %}" style="color: white; text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
                <h2 style="margin-top: 10px;">Add Participants</h2>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div style="padding: 15px;">
                    <p style="margin-bottom: 15px;">Select contacts to add to the group:</p>
                    
                    {% for contact in contacts %}
                        <label style="display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid #eee;">
                            <input type="checkbox" name="members" value="{{ contact.user.id }}" style="margin-right: 15px;">
                            <div class="chat-avatar" style="width: 40px; height: 40px; margin-right: 15px;">
                                {% if contact.user.chat_profile.avatar %}
                                    <img src="{{ contact.user.chat_profile.avatar.url }}">
                                {% else %}
                                    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--secondary); color: white; font-size: 16px;">
                                        {{ contact.user.username.0|upper }}
                                    </div>
                                {% endif %}
                            </div>
                            <span style="font-weight: 500;">{{ contact.user.username }}</span>
                        </label>
                    {% empty %}
                        <p style="text-align: center; padding: 20px; color: #999;">No contacts to add</p>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">
                        Add Selected
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
