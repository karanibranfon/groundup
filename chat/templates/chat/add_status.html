{% extends 'chat/base.html' %}

{% block title %}Add Status{% endblock %}

{% block content %}
<div style="min-height: 100vh; background: var(--primary); padding: 20px;">
    <div style="max-width: 500px; margin: 0 auto;">
        <div style="background: white; border-radius: 10px; overflow: hidden;">
            <div style="background: #075E54; padding: 15px; color: white; display: flex; justify-content: space-between; align-items: center;">
                <a href="{% url 'status_list' %}" style="color: white; text-decoration: none;">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h2>My Status</h2>
                <span></span>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div style="padding: 20px;">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <label for="mediaInput" style="cursor: pointer; display: block;">
                            <div id="mediaPreview" style="width: 200px; height: 200px; border-radius: 10px; margin: 0 auto; background: #f0f0f0; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                <div id="previewContent">
                                    <i class="fas fa-camera" style="font-size: 40px; color: #999;"></i>
                                    <p style="color: #999; margin-top: 10px;">Tap to add media</p>
                                </div>
                            </div>
                        </label>
                        <input type="file" id="mediaInput" name="media" accept="image/*,video/*" style="display: none;" onchange="previewMedia(this)">
                    </div>
                    
                    <div class="form-group">
                        <label>Caption (optional)</label>
                        <textarea name="text" placeholder="Add a caption..." rows="3" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; resize: none;"></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-paper-plane"></i> Post Status
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function previewMedia(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        const preview = document.getElementById('previewContent');
        
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = '<img src="' + e.target.result + '" style="width: 100%; height: 100%; object-fit: cover;">';
            }
            reader.readAsDataURL(file);
        } else if (file.type.startsWith('video/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = '<video src="' + e.target.result + '" style="width: 100%; height: 100%; object-fit: cover;"></video>';
            }
            reader.readAsDataURL(file);
        }
    }
}
</script>
{% endblock %}
