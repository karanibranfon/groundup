<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WhatsApp Clone{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #075E54;
            --primary-light: #128C7E;
            --secondary: #25D366;
            --accent: #34B7F1;
            --bg-light: #ECE5DD;
            --bg-dark: #0C1419;
            --chat-bg: #E5DDD5;
            --message-sent: #DCF8C6;
            --message-received: #FFFFFF;
            --text-dark: #303030;
            --text-light: #667781;
            --text-white: #FFFFFF;
            --danger: #FF5252;
            --warning: #FFB300;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            min-height: 100vh;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 30%;
            min-width: 300px;
            max-width: 450px;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        
        .main-content {
            flex: 1;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: var(--primary);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-white);
        }
        
        .header h2 {
            font-size: 16px;
            font-weight: 500;
        }
        
        .header-actions {
            display: flex;
            gap: 20px;
        }
        
        .header-actions a, .header-actions button {
            color: var(--text-white);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        
        .search-bar {
            padding: 8px 12px;
            background: var(--primary-light);
        }
        
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            background: var(--text-white);
            outline: none;
            font-size: 14px;
        }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .chat-item {
            display: flex;
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .chat-item:hover {
            background: var(--primary-light);
        }
        
        .chat-item.active {
            background: var(--primary-light);
        }
        
        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 12px;
            overflow: hidden;
        }
        
        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .chat-name {
            font-weight: 500;
            color: var(--text-white);
            font-size: 15px;
        }
        
        .chat-time {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        
        .chat-preview {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-preview .typing {
            color: var(--secondary);
            font-style: italic;
        }
        
        .unread-badge {
            background: var(--secondary);
            color: var(--text-white);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }
        
        .chat-header {
            background: var(--primary);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            color: var(--text-white);
        }
        
        .chat-header .back-btn {
            display: none;
            margin-right: 15px;
            cursor: pointer;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .message {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 7px;
            position: relative;
            word-wrap: break-word;
        }
        
        .message.sent {
            align-self: flex-end;
            background: var(--message-sent);
            border-top-right-radius: 0;
        }
        
        .message.received {
            align-self: flex-start;
            background: var(--message-received);
            border-top-left-radius: 0;
        }
        
        .message-content {
            font-size: 14px;
            color: var(--text-dark);
        }
        
        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-light);
        }
        
        .message-status {
            font-size: 12px;
        }
        
        .message-status.read {
            color: var(--accent);
        }
        
        .message-image {
            max-width: 250px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .chat-input-area {
            background: var(--text-white);
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: var(--bg-light);
            outline: none;
            font-size: 14px;
        }
        
        .chat-input-area button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-light);
            padding: 8px;
        }
        
        .chat-input-area button.send-btn {
            color: var(--primary);
        }
        
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--chat-bg);
        }
        
        .empty-chat i {
            font-size: 80px;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        
        .empty-chat h2 {
            color: var(--text-dark);
            margin-bottom: 10px;
        }
        
        .empty-chat p {
            color: var(--text-light);
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: var(--message-received);
            border-radius: 15px;
            width: fit-content;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-light);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        .online-indicator {
            width: 12px;
            height: 12px;
            background: var(--secondary);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid var(--primary);
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--text-white);
        }
        
        .btn-secondary {
            background: var(--secondary);
            color: var(--text-white);
        }
        
        .btn-outline {
            border: 1px solid var(--primary);
            color: var(--primary);
            background: transparent;
        }
        
        .tabs {
            display: flex;
            background: var(--primary);
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            text-decoration: none;
            position: relative;
        }
        
        .tab.active {
            color: var(--text-white);
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--text-white);
            border-radius: 2px;
        }
        
        .tab i {
            font-size: 20px;
            margin-bottom: 5px;
            display: block;
        }
        
        .tab span {
            font-size: 12px;
        }
        
        .mobile-header {
            display: none;
            background: var(--primary);
            padding: 10px 15px;
            color: var(--text-white);
        }
        
        .mobile-header h2 {
            font-size: 18px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--text-white);
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .status-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .status-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            overflow: hidden;
        }
        
        .status-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .status-ring.add {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.1);
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                left: 0;
                z-index: 10;
            }
            
            .sidebar.hidden {
                display: none;
            }
            
            .main-content {
                width: 100%;
            }
            
            .chat-header .back-btn {
                display: block;
            }
            
            .mobile-header {
                display: block;
            }
            
            .message {
                max-width: 80%;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
