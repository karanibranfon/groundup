{% extends 'chat/base.html' %}

{% block title %}Profile - WhatsApp Clone{% endblock %}

{% block content %}
<div style="min-height: 100vh; background: var(--bg-light); padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto;">
        <div style="background: white; border-radius: 10px; overflow: hidden;">
            <div style="background: var(--primary); padding: 15px; color: white;">
                <a href="{% url 'chat_list' %}" style="color: white; text-decoration: none;"><i class="fas fa-arrow-left"></i> Back</a>
                <h2 style="margin-top: 10px;">Profile</h2>
            </div>
            <div style="padding: 20px; text-align: center;">
                <div style="width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px; overflow: hidden; background: var(--secondary); display: flex; align-items: center; justify-content: center;">
                    {% if profile.avatar %}
                        <img src="{{ profile.avatar.url }}" style="width: 100%; height: 100%; object-fit: cover;">
                    {% else %}
                        <span style="font-size: 48px; color: white;">{{ user.username.0|upper }}</span>
                    {% endif %}
                </div>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="file" name="avatar" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" value="{{ user.username }}" disabled>
                    </div>
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="first_name" value="{{ user.first_name }}">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="last_name" value="{{ user.last_name }}">
                    </div>
                    <div class="form-group">
                        <label>About</label>
                        <input type="text" name="about" value="{{ profile.about }}" placeholder="Hey there! I'm using WhatsApp">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="phone" value="{{ profile.phone }}">
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
