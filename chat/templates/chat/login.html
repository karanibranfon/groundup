{% extends 'chat/base.html' %}

{% block title %}Login - WhatsApp Clone{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary);">
    <div style="background: white; padding: 40px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center;">
        <div style="margin-bottom: 30px;">
            <i class="fab fa-whatsapp" style="font-size: 60px; color: var(--primary);"></i>
        </div>
        
        <h2 style="color: var(--text-dark); margin-bottom: 20px;">Welcome Back</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div style="background: #FF5252; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="post" style="text-align: left;">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                Login
            </button>
        </form>
        
        <p style="margin-top: 20px; color: var(--text-light);">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary);">Register</a>
        </p>
    </div>
</div>
{% endblock %}
