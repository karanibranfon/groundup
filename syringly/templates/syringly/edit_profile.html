{% extends 'syringly/base.html' %}

{% block title %}Edit Profile - Syringly{% endblock %}

{% block content %}
<div class="edit-profile-page" style="max-width: 600px;">
    <h1>Edit Profile</h1>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" name="first_name" id="first_name" class="form-control" 
                   value="{{ request.user.first_name }}" placeholder="Your first name">
        </div>
        
        <div class="mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" name="last_name" id="last_name" class="form-control" 
                   value="{{ request.user.last_name }}" placeholder="Your last name">
        </div>
        
        <div class="mb-3">
            <label for="specialty" class="form-label">Medical Specialty</label>
            <input type="text" name="specialty" id="specialty" class="form-control" 
                   value="{{ profile.specialty }}" placeholder="e.g., Cardiology, Neurology">
            <small class="text-muted">Your area of medical expertise</small>
        </div>
        
        <div class="mb-3">
            <label for="bio" class="form-label">Bio</label>
            <textarea name="bio" id="bio" class="form-control" rows="4" 
                      placeholder="Tell other medical professionals about yourself...">{{ profile.bio }}</textarea>
            <small class="text-muted">Brief description about yourself</small>
        </div>
        
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save Profile</button>
            <a href="{% url 'syringly:profile' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
